[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Deliberately not a usable fallback. migrations/env.py requires DATABASE_URL
# (or an explicitly supplied Alembic connection) so production can never
# migrate an accidental local SQLite database.
sqlalchemy.url = driver://required-via-DATABASE_URL

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
